<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת לוח עדכונים דיגיטלי</title>
    <!-- Favicon & Home Screen Icon -->
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="apple-mobile-web-app-title" content="גן החלומות">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        /* איפוס הגדרות דפדפן */
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            /* מונע גלילה כפולה ומשאיר אותה רק בתוך המערכת */
            background-color: #0f1621;
            /* תואם לעיצוב ה-Dark של המערכת */
        }

        /* הגדרות ה-Iframe */
        #app-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* מסך טעינה יפה בזמן שהמערכת עולה */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f1621;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s ease;
            color: #fbc02d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(251, 192, 45, 0.1);
            border-top: 5px solid #fbc02d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <!-- מסך טעינה -->
    <div id="loader">
        <div class="spinner"></div>
        <div style="font-weight: bold; letter-spacing: 1px;">טוען מערכת...</div>
    </div>

    <script>
        // הגדרת כתובת הגוגל סקריפט - המשתמש יצטרך לעדכן זאת פעם אחת כאן
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzf22eIzN1QKLY81VqEZKgTYSdGvnV1bMxh0G_3RuyP51JKSpJLuZANHhUIA98ERzzB/exec";

        function initApp() {
            // גוגל חוסמת הטמעת Apps Script ב-iframe מדומיין אחר
            // (X-Frame-Options: SAMEORIGIN + CSP frame-ancestors 'self'),
            // ולכן מפנים ישירות במקום להטמיע. כל הפרמטרים מה-URL עוברים הלאה
            // (למשל ?branch=kaplan, דפי הורים, דוחות).
            const target = GOOGLE_SCRIPT_URL + window.location.search;
            window.location.replace(target);
        }

        // הפעלת האפליקציה (מסך הטעינה נשאר עד שההפניה מתבצעת)
        initApp();

        // תיקון גובה במסכים ניידים (Mobile Safe) — למסך הטעינה
        function resize() {
            document.body.style.height = window.innerHeight + 'px';
        }
        window.addEventListener('resize', resize);
        resize();
    </script>
</body>

</html>
