<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת לוח עדכונים דיגיטלי</title>
    <!-- Favicon - logic to look professional -->
    <link rel="icon" type="image/png"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/svgs/solid/calendar-check.svg">

    <style>
        /* איפוס הגדרות דפדפן */
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            /* מונע גלילה כפולה ומשאיר אותה רק בתוך המערכת */
            background-color: #0f1621;
            /* תואם לעיצוב ה-Dark של המערכת */
        }

        /* הגדרות ה-Iframe */
        #app-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* מסך טעינה יפה בזמן שהמערכת עולה */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f1621;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s ease;
            color: #fbc02d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(251, 192, 45, 0.1);
            border-top: 5px solid #fbc02d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <!-- מסך טעינה -->
    <div id="loader">
        <div class="spinner"></div>
        <div style="font-weight: bold; letter-spacing: 1px;">טוען מערכת...</div>
    </div>

    <!-- המערכת עצמה -->
    <iframe id="app-frame" allow="clipboard-read; clipboard-write; geolocation" onload="hideLoader()"></iframe>

    <script>
        // הגדרת כתובת הגוגל סקריפט - המשתמש יצטרך לעדכן זאת פעם אחת כאן
        const GOOGLE_SCRIPT_URL = "YOUR_SCRIPT_URL";

        function initApp() {
            const frame = document.getElementById('app-frame');
            const urlParams = window.location.search;

            // בונה את הקישור הסופי עם כל הפרמטרים שהגיעו מהדף העוטף (URL Parameters)
            // זה מאפשר להגיע ישירות לדפי הורים, דוחות וכו' דרך הכתובת של GitHub
            frame.src = GOOGLE_SCRIPT_URL + urlParams;
        }

        // הפעלת האפליקציה
        initApp();

        function hideLoader() {
            const loader = document.getElementById('loader');
            if (!loader) return;
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 500);
        }

        // אופציונלי: תיקון גובה במסכים ניידים (Mobile Safe)
        function resize() {
            document.body.style.height = window.innerHeight + 'px';
        }
        window.addEventListener('resize', resize);
        resize();
    </script>
</body>

</html>
